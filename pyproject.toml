[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepilot"
version = "0.1.0"
description = "Voice-first AI agent orchestrator with defensive audio validation, replaceable STT/TTS adapters, LangGraph turn management, and latency tracing."
readme = "README.md"
authors = [{ name = "VoicePilot Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "edge-tts>=6.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local-stt = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
voicepilot = "voicepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["B008", "E501"]
